name: Supabase keep-alive

# Supabase free-tier projects auto-pause after 7 days with no API activity.
# This pings the REST API every 3 days so the project never goes idle long enough to pause.
# Uses the public anon key only (no secrets). Restore the project once from the Supabase
# dashboard if it is already paused — this job keeps an *active* project from pausing again.

on:
  schedule:
    - cron: '0 6 */3 * *'   # 06:00 UTC every 3 days
  workflow_dispatch: {}      # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6cG1ncGZ0ZnFpZnJ1eWZrY2JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMTA0NTYsImV4cCI6MjA5MDg4NjQ1Nn0.eHJo_C7iC3-S9hPwduNg4VFV4R-ebsweak6wZZwuzK8"
          URL="https://ezpmgpftfqifruyfkcbs.supabase.co/rest/v1/spec_section_library?select=id&limit=1"
          echo "Pinging $URL"
          CODE=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" "$URL" -H "apikey: $ANON" -H "Authorization: Bearer $ANON")
          echo "HTTP $CODE"
          cat /tmp/resp.txt
          # 200 = active and responded. Any 2xx/4xx still proves a request reached the project.
          if [ "$CODE" -ge 500 ] || [ "$CODE" -eq 000 ]; then
            echo "::error::Supabase did not respond healthily (HTTP $CODE) — it may be paused; restore it from the dashboard."
            exit 1
          fi
