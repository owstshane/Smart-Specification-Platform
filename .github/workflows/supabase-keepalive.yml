name: Supabase keep-alive

# Supabase free-tier projects auto-pause after 7 days with no API activity.
# This pings the REST API every 3 days so the project never goes idle long enough to pause.
# Uses the public anon key only (no secrets). Restore the project once from the Supabase
# dashboard if it is already paused — this job keeps an *active* project from pausing again.

on:
  schedule:
    - cron: '0 6 */3 * *'   # 06:00 UTC every 3 days
  workflow_dispatch: {}      # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6cG1ncGZ0ZnFpZnJ1eWZrY2JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMTA0NTYsImV4cCI6MjA5MDg4NjQ1Nn0.eHJo_C7iC3-S9hPwduNg4VFV4R-ebsweak6wZZwuzK8"
          URL="https://ezpmgpftfqifruyfkcbs.supabase.co/auth/v1/health"
          echo "Pinging $URL"
          CODE=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" "$URL" -H "apikey: $ANON")
          echo "HTTP $CODE"
          cat /tmp/resp.txt; echo
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase health check returned HTTP $CODE — the project may be paused; restore it from the dashboard."
            exit 1
          fi
          echo "Supabase is active."
